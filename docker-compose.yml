version: '3.8'

services:
  # b1t-core service removed: assumes B1T Node is running externally (Host)
  # If you want to run the node inside Docker, uncomment the b1t-core service definition block.

  wallet-backend:
    container_name: b1t-wallet-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=b1t-db
    networks:
      - b1t-network
    depends_on:
      - b1t-db
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  wallet-frontend:
    container_name: b1t-wallet-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
      - NODE_ENV=development
    networks:
      - b1t-network
    depends_on:
      - wallet-backend
    restart: unless-stopped

  b1t-db:
    container_name: b1t-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=b1t
      - POSTGRES_PASSWORD=b1tpass
      - POSTGRES_DB=b1twallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - b1t-network
    restart: unless-stopped

networks:
  b1t-network:
    driver: bridge

volumes:
  pgdata:
