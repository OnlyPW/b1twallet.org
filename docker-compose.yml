services:
  bitcore:
    build:
      context: https://github.com/OnlyPW/Bitcore-docker-B1T.git#main
    container_name: b1t-core
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - NETWORK=mainnet
      - RPC_USER=user
      - RPC_PASSWORD=changeme
      - RPC_ALLOW_IP=0.0.0.0/0
    volumes:
      - bitcore-data:/data
      # Vorlage sorgt dafür, dass das Image die vollständige bit.conf (mit Indizes) erzeugt
      - ./bitcore-config/bit.conf.template:/config/bit.conf:ro
    ports:
      - "8333:8333"
      - "8332:8332"
    networks:
      - b1t-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u user:changeme -d '{\"jsonrpc\":\"1.0\",\"id\":\"1\",\"method\":\"getblockcount\",\"params\":[]}' http://127.0.0.1:8332/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  ord-indexer:
    build:
      context: ./TEMP_ORD_BIT
    container_name: b1t-ord-indexer
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - FIRST_INSCRIPTION_HEIGHT=0
    entrypoint:
      - "ord"
      - "--chain=mainnet"
      - "--rpc-url=http://user:changeme@b1t-core:8332"
      - "--data-dir=/root/.data"
      - "--index-transactions"
      - "server"
      - "--http-port=8080"

    ports:
      - "8081:8080"

    volumes:
      - ord-data:/root/.data
    networks:
      - b1t-network
    depends_on:
      bitcore:
        condition: service_healthy

  wallet-backend:
    container_name: b1t-wallet-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - RPC_HOST=b1t-core
      - RPC_PORT=8332
      - RPC_USER=user
      - RPC_PASSWORD=changeme
      - PORT=3001
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3002
      - DB_HOST=b1t-db
      - DB_PORT=5432
      - DB_USER=b1t
      - DB_PASSWORD=b1tpass
      - DB_NAME=b1twallet
      - INDEXER_ENABLED=true
      - INDEXER_START_HEIGHT=0
      - INDEXER_BATCH_SIZE=1000
      - ORD_INDEXER_URL=http://b1t-ord-indexer:8080
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - b1t-network
    depends_on:
      b1t-db:
        condition: service_healthy
      bitcore:
        condition: service_healthy
    restart: unless-stopped

  wallet-frontend:
    container_name: b1t-wallet-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - b1t-network
    depends_on:
      - wallet-backend
    restart: unless-stopped



  b1t-db:
    container_name: b1t-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=b1t
      - POSTGRES_PASSWORD=b1tpass
      - POSTGRES_DB=b1twallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - b1t-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b1t -d b1twallet"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  b1t-network:
    driver: bridge

volumes:
  pgdata:
    name: b1t-pgdata
  bitcore-data:
    # Fester Name: gleiches Volume bei jedem Start/Neustart, unabhängig vom Projektpfad – verhindert Neusync der Blockchain
    name: b1t-bitcore-data
  ord-data:
    name: b1t-ord-data
