services:
  bitcore:
    build:
      context: https://github.com/OnlyPW/Bitcore-docker-B1T.git#main
    container_name: b1t-core
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - NETWORK=mainnet
      - RPC_USER=user
      - RPC_PASSWORD=changeme
      - RPC_ALLOW_IP=0.0.0.0/0
    volumes:
      - bitcore-data:/data
    ports:
      - "8333:8333"
      - "8332:8332"
    networks:
      - b1t-network

  ord-indexer:
    build:
      context: ./TEMP_ORD_BIT
    container_name: b1t-ord-indexer
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - FIRST_INSCRIPTION_HEIGHT=0
    entrypoint:
      - "ord"
      - "--chain=mainnet"
      - "--rpc-url=http://user:changeme@b1t-core:8332"
      - "--data-dir=/root/.data"
      - "--index-transactions"
      - "server"
      - "--http-port=8080"

    ports:
      - "8081:8080"

    volumes:
      - ord-data:/root/.data
    networks:
      - b1t-network
    depends_on:
      - bitcore

  wallet-backend:
    container_name: b1t-wallet-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - RPC_HOST=b1t-core
      - RPC_PORT=8332
      - RPC_USER=user
      - RPC_PASSWORD=changeme
      - PORT=3001
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3002
      - DB_HOST=b1t-db
      - DB_PORT=5432
      - DB_USER=b1t
      - DB_PASSWORD=b1tpass
      - DB_NAME=b1twallet
      - INDEXER_ENABLED=true
      - INDEXER_START_HEIGHT=0
      - ORD_INDEXER_URL=http://b1t-ord-indexer:8080
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - b1t-network
    depends_on:
      - b1t-db
      - bitcore
    restart: unless-stopped

  wallet-frontend:
    container_name: b1t-wallet-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - b1t-network
    depends_on:
      - wallet-backend
    restart: unless-stopped



  b1t-db:
    container_name: b1t-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=b1t
      - POSTGRES_PASSWORD=b1tpass
      - POSTGRES_DB=b1twallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - b1t-network
    restart: unless-stopped

networks:
  b1t-network:
    driver: bridge

volumes:
  pgdata:
  bitcore-data:
  ord-data:
