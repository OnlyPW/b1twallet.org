version: '3.8'

services:
  # B1T Core Node (bereits vorhanden - nur Referenz)
  # bitcore:
  #   container_name: bitcore
  #   image: your-bitcore-image
  #   ports:
  #     - "8332:8332"
  #     - "8333:8333"
  #   volumes:
  #     - ./bit.conf:/root/.bit/bit.conf

  # Backend - RPC Proxy
  wallet-backend:
    container_name: b1t-wallet-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      # Standard RPC Settings
      - RPC_HOST=host.docker.internal
      - RPC_PORT=8332
      - RPC_USER=user
      - RPC_PASSWORD=changeme
      # B1T-20 Ordinals RPC Settings
      - B1T_RPC_URL=http://host.docker.internal:8332
      - B1T_RPC_USER=user
      - B1T_RPC_PASSWORD=changeme
      # Server Settings
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3002
      # Database
      - DB_HOST=b1t-db
      - DB_PORT=5432
      - DB_USER=b1t
      - DB_PASSWORD=b1tpass
      - DB_NAME=b1twallet
      # Indexer (requires B1T Core Node)
      - INDEXER_ENABLED=true
      - INDEXER_START_HEIGHT=0
      # RPC Method Configuration
      # - RPC_SKIP_SCANTXOUTSET=true  # Removed to enable scantxoutset
    networks:
      - b1t-network
      - bitcore-docker-b1t-_default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - b1t-db
    restart: unless-stopped

  # Frontend - React App
  wallet-frontend:
    container_name: b1t-wallet-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - b1t-network
    depends_on:
      - wallet-backend
    restart: unless-stopped

  # Database - PostgreSQL
  b1t-db:
    container_name: b1t-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=b1t
      - POSTGRES_PASSWORD=b1tpass
      - POSTGRES_DB=b1twallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - b1t-network
    restart: unless-stopped

networks:
  b1t-network:
    driver: bridge
  bitcore-docker-b1t-_default:
    external: true

volumes:
  node_modules_backend:
  node_modules_frontend:
  pgdata:


