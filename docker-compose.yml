version: '3.8'

services:
  bitcore:
    build:
      context: ./TEMP/Bitcore-docker-B1T
    container_name: b1t-core
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - NETWORK=mainnet
      - RPC_USER=user
      - RPC_PASSWORD=changeme
      - RPC_ALLOW_IP=0.0.0.0/0
    volumes:
      - bitcore-data:/data
      - ./TEMP/Bitcore-docker-B1T/config:/config
    ports:
      - "8333:8333"
      - "8332:8332"
    networks:
      - b1t-network

  wallet-backend:
    container_name: b1t-wallet-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - RPC_HOST=b1t-core
      - RPC_PORT=8332
      - RPC_USER=user
      - RPC_PASSWORD=changeme
      - PORT=3001
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3002
      - DB_HOST=b1t-db
      - DB_PORT=5432
      - DB_USER=b1t
      - DB_PASSWORD=b1tpass
      - DB_NAME=b1twallet
      - INDEXER_ENABLED=true
      - INDEXER_START_HEIGHT=0
    networks:
      - b1t-network
    depends_on:
      - b1t-db
      - bitcore
    restart: unless-stopped

  wallet-frontend:
    container_name: b1t-wallet-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
      - NODE_ENV=development
    networks:
      - b1t-network
    depends_on:
      - wallet-backend
    restart: unless-stopped

  b1t-db:
    container_name: b1t-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=b1t
      - POSTGRES_PASSWORD=b1tpass
      - POSTGRES_DB=b1twallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - b1t-network
    restart: unless-stopped

networks:
  b1t-network:
    driver: bridge

volumes:
  pgdata:
  bitcore-data:
